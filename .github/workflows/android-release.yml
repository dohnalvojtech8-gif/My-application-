name: Android release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version visible to users (for example 1.0.0)
        required: true
        default: '1.0.0'
      build_number:
        description: New increasing positive version code
        required: true
permissions:
  contents: read
concurrency:
  group: android-distribution
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: google-play
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build_number }}
      MOBILE_SERVER_URL: ${{ vars.MOBILE_SERVER_URL || 'https://my-application-99m3.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Decode upload key into temporary runner storage
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          if not re.fullmatch(r'[1-9]\d{0,8}', os.environ['RELEASE_BUILD']):
              raise SystemExit('Invalid increasing build number')
          if not re.fullmatch(r'\d+\.\d+\.\d+', os.environ['RELEASE_VERSION']):
              raise SystemExit('Version must be x.y.z')
          value = os.environ['ANDROID_KEYSTORE_BASE64']
          if not value:
              raise SystemExit('Set ANDROID_KEYSTORE_BASE64 in the google-play environment')
          target = Path(os.environ['RUNNER_TEMP']) / 'money-upload.jks'
          target.write_bytes(base64.b64decode(''.join(value.split()), validate=True))
          target.chmod(0o600)
          PY
      - name: Build signed Play bundle and installable APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/money-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: systematic-money-android-release-${{ inputs.build_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/money-upload.jks"
